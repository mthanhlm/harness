; The harness had no way to check itself.
;
; Its detector only looks for a manifest at the repository root, and the Python
; lives two directories down under plugins/harness/. So `languages` came back
; ["unknown"], no per-file check was configured for a .py file, and the
; end-of-turn gate had nothing to run — a syntax error in a hook script passed
; both gates and 138 tests never ran at either of them.
;
; `testpaths` is what makes a bare `pytest` work from the root: collection would
; otherwise reach evals/cases/, which holds deliberately broken fixtures.
[pytest]
testpaths = plugins/harness/tests
