; The harness had no way to check itself.
;
; Its detector only looks for a manifest at the repository root, and the Python
; lives two directories down under plugins/harness/. So `languages` came back
; ["unknown"], no per-file check was configured for a .py file, and the
; end-of-turn gate had nothing to run — a syntax error in a hook script passed
; both gates and 138 tests never ran at either of them.
;
; `testpaths` is what makes a bare `pytest` work from the root: collection would
; otherwise reach evals/cases/, which holds deliberately broken fixtures.
;
; `prepublish` is deselected by default, and that is load-bearing rather than
; tidy. Every other test here asserts something about the code; a prepublish
; check asserts something about the *working tree*, and a test whose outcome
; depends on the tree being dirty makes mutation testing a tautology — mutate any
; file, that check goes red, and the mutation reads as caught no matter whether a
; single real test understood what was broken. Measured: a sweep of 18 mutations
; scored 18/18 while the suite was in fact blind to several of them.
;
; That matters here more than in most repositories, because this plugin's own
; agents mutation-test to decide whether a test is real, and `reviewer-tests.md`
; instructs them to read all-red as proof of coverage.
;
; The cost is that an unbumped version is no longer caught mid-session. Run
; `python3 -m pytest -m prepublish` before publishing; without the bump,
; `claude plugin marketplace update` leaves the old code installed and the fix
; looks wrong rather than unpublished.
[pytest]
testpaths = plugins/harness/tests
markers =
    prepublish: asserts a property of the working tree, not of the code. Deselected by default so a mutation sweep measures the tests rather than itself.
addopts = -m "not prepublish"
